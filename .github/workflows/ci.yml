name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typescript:
    name: TypeScript build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable corepack (Yarn 4)
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build module (tsc via expo-module-scripts)
        run: yarn build

  android:
    name: Android build (example app)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Enable corepack (Yarn 4)
        run: corepack enable

      # Root install first: autolinking resolves the module from .. and the
      # example's app.json loads ../app.plugin.js.
      - name: Install module dependencies
        run: yarn install --immutable

      - name: Install example dependencies
        working-directory: example
        run: yarn install --immutable

      - name: Prebuild Android project
        working-directory: example
        run: npx expo prebuild --platform android --no-install

      - name: Compile Android app + module
        working-directory: example/android
        run: ./gradlew assembleDebug

  ios:
    name: iOS build (example app)
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable corepack (Yarn 4)
        run: corepack enable

      - name: Install module dependencies
        run: yarn install --immutable

      - name: Install example dependencies
        working-directory: example
        run: yarn install --immutable

      - name: Prebuild iOS project
        working-directory: example
        run: npx expo prebuild --platform ios --no-install

      - name: Install CocoaPods
        working-directory: example
        run: npx pod-install ios

      - name: Compile iOS app + module
        working-directory: example/ios
        run: |
          set -o pipefail
          WORKSPACE=$(ls -d *.xcworkspace | head -n1)
          SCHEME="${WORKSPACE%.xcworkspace}"
          echo "Building workspace=$WORKSPACE scheme=$SCHEME"
          xcodebuild build \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            | tail -n 200
