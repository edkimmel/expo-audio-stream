name: CI

# PRs into main run once (pull_request). Direct pushes to main still run.
# Feature-branch pushes are not a second trigger — that doubled every check
# on PRs from claude/** (push + pull_request for the same SHA).
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, ready_for_review, reopened, synchronize]
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  typescript:
    name: TypeScript build & tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable corepack (Yarn 4)
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build module (tsc)
        run: yarn build

      - name: Build config plugin
        run: npx expo-module build plugin

      - name: Run unit tests (jest)
        run: yarn test

  android:
    name: Android build (example app)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Enable corepack (Yarn 4)
        run: corepack enable

      # Root install first: autolinking resolves the module from .. and the
      # example's app.json loads ../app.plugin.js.
      - name: Install module dependencies
        run: yarn install --immutable

      # app.plugin.js requires ./plugin/build, which this generates. npm runs
      # the root `prepare` script on install; Yarn 4 does not, so CI builds it
      # explicitly.
      - name: Build config plugin
        run: npx expo-module build plugin

      - name: Install example dependencies
        working-directory: example
        run: yarn install --immutable

      - name: Prebuild Android project
        working-directory: example
        run: npx expo prebuild --platform android --no-install

      - name: Kotlin unit tests (module)
        working-directory: example/android
        run: ./gradlew testDebugUnitTest

      - name: Compile Android app + module
        working-directory: example/android
        run: ./gradlew assembleDebug

  android-e2e:
    name: Android e2e (Maestro)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4

      - name: Enable KVM for emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Enable corepack (Yarn 4)
        run: corepack enable

      - name: Install module dependencies
        run: yarn install --immutable

      - name: Build config plugin
        run: npx expo-module build plugin

      - name: Install example dependencies
        working-directory: example
        run: yarn install --immutable

      - name: Prebuild Android project
        working-directory: example
        run: npx expo prebuild --platform android --no-install

      # Release build bundles the JS (no Metro needed on-device); the Expo
      # prebuild template signs release with the debug keystore by default.
      - name: Build release APK
        working-directory: example/android
        run: ./gradlew assembleRelease

      - name: Cache Maestro CLI
        uses: actions/cache@v4
        id: maestro-cache
        with:
          path: ~/.maestro
          key: maestro-${{ runner.os }}-v1

      - name: Install Maestro
        if: steps.maestro-cache.outputs.cache-hit != 'true'
        run: curl -Ls "https://get.maestro.mobile.dev" | bash

      - name: Add Maestro to PATH
        run: echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      # The emulator needs a host audio server or its virtual audio device
      # never consumes frames — AudioTrack writes then block forever and the
      # pipeline never drains (run #4 failed exactly this way: "pulseaudio:
      # Failed to initialize PA context"). Do not pass -noaudio to the
      # emulator; the default runner flags include it.
      - name: Start PulseAudio (emulator audio backend)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq pulseaudio
          pulseaudio --start --exit-idle-time=-1
          pactl info

      # Official android-emulator-runner snapshot cache: first miss creates
      # the AVD + a clean boot snapshot; later runs load it in seconds.
      # Cache the system image too so a miss does not re-download ~1GB.
      - name: Cache AVD and system image
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
            ${{ env.ANDROID_HOME }}/system-images
            ${{ env.ANDROID_HOME }}/emulator
          key: avd-34-default-x86_64-audio-v1

      - name: Create AVD snapshot
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: default
          avd-name: expo-audio-e2e
          force-avd-creation: false
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-boot-anim -camera-back none
          script: echo "Generated AVD snapshot for caching."

      - name: Run Maestro suites on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: default
          avd-name: expo-audio-e2e
          force-avd-creation: false
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -no-boot-anim -camera-back none
          script: yarn e2e:android -- --skip-avd

      # Maestro writes into a hidden .maestro/ subdirectory, so hidden files
      # must be included or the artifact uploads empty.
      - name: Upload Maestro debug output
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-debug
          path: maestro-debug
          include-hidden-files: true

  ios:
    name: iOS build (example app)
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable corepack (Yarn 4)
        run: corepack enable

      # Fast native-logic signal before the expensive app build: JitterBuffer
      # is dependency-free Swift, compiled and run directly.
      - name: Swift unit tests (JitterBuffer)
        run: |
          swiftc -parse-as-library -o /tmp/jitterbuffer-tests \
            ios/JitterBuffer.swift tests/ios/JitterBufferTests.swift
          /tmp/jitterbuffer-tests

      - name: Install module dependencies
        run: yarn install --immutable

      # app.plugin.js requires ./plugin/build, which this generates. npm runs
      # the root `prepare` script on install; Yarn 4 does not, so CI builds it
      # explicitly.
      - name: Build config plugin
        run: npx expo-module build plugin

      - name: Install example dependencies
        working-directory: example
        run: yarn install --immutable

      - name: Prebuild iOS project
        working-directory: example
        run: npx expo prebuild --platform ios --no-install

      - name: Install CocoaPods
        working-directory: example
        run: npx pod-install ios

      - name: Compile iOS app + module
        working-directory: example/ios
        run: |
          set -o pipefail
          WORKSPACE=$(ls -d *.xcworkspace | head -n1)
          SCHEME="${WORKSPACE%.xcworkspace}"
          echo "Building workspace=$WORKSPACE scheme=$SCHEME"
          xcodebuild build \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            | tail -n 200

  ios-e2e:
    name: iOS e2e (Maestro)
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Maestro is a JVM CLI; pin a known JDK rather than the image default.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Enable corepack (Yarn 4)
        run: corepack enable

      - name: Install module dependencies
        run: yarn install --immutable

      # app.plugin.js requires ./plugin/build, which this generates. npm runs
      # the root `prepare` script on install; Yarn 4 does not, so CI builds it
      # explicitly.
      - name: Build config plugin
        run: npx expo-module build plugin

      - name: Install example dependencies
        working-directory: example
        run: yarn install --immutable

      - name: Prebuild iOS project
        working-directory: example
        run: npx expo prebuild --platform ios --no-install

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/CocoaPods
            example/ios/Pods
          key: cocoapods-${{ runner.os }}-${{ hashFiles('example/yarn.lock', 'example/ios/Podfile') }}

      - name: Install CocoaPods
        working-directory: example
        run: npx pod-install ios

      - name: Cache DerivedData
        uses: actions/cache@v4
        with:
          path: example/ios/DerivedData
          key: ios-dd-release-${{ runner.os }}-${{ hashFiles('example/yarn.lock', 'example/ios/Podfile.lock', 'src/**', 'ios/**', 'plugin/src/**', 'example/App.tsx', 'example/screens/**', 'example/testkit/**', 'example/app.json') }}

      - name: Cache Maestro CLI
        uses: actions/cache@v4
        id: maestro-cache
        with:
          path: ~/.maestro
          key: maestro-${{ runner.os }}-v1

      - name: Install Maestro
        if: steps.maestro-cache.outputs.cache-hit != 'true'
        run: curl -Ls "https://get.maestro.mobile.dev" | bash

      - name: Add Maestro to PATH
        run: echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      # Release embeds main.jsbundle (Debug skips bundling and needs Metro).
      # generic/platform=iOS Simulator produces an installable sim .app without
      # pinning a device name that may not exist on the image.
      - name: Build release simulator app
        working-directory: example/ios
        run: |
          set -o pipefail
          WORKSPACE=$(ls -d *.xcworkspace | head -n1)
          SCHEME="${WORKSPACE%.xcworkspace}"
          echo "Building workspace=$WORKSPACE scheme=$SCHEME"
          xcodebuild build \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            | tail -n 80

      - name: Boot iOS Simulator
        run: |
          set -euo pipefail
          xcodebuild -version
          python3 - <<'PY'
          import json, os, subprocess, sys

          data = json.loads(
              subprocess.check_output(
                  ["xcrun", "simctl", "list", "devices", "available", "-j"]
              )
          )
          preferred = [
              "iPhone 16",
              "iPhone 16e",
              "iPhone 17",
              "iPhone 15",
              "iPhone 16 Pro",
              "iPhone 17 Pro",
          ]
          devices = []
          for runtime, listed in data.get("devices", {}).items():
              for device in listed:
                  if device.get("isAvailable") is False:
                      continue
                  device = dict(device)
                  device["runtime"] = runtime
                  devices.append(device)
                  print(f"  {device.get('name')}  {runtime}  {device.get('udid')}")

          picked = None
          for name in preferred:
              picked = next((d for d in devices if d.get("name") == name), None)
              if picked:
                  break
          if picked is None:
              picked = next(
                  (d for d in devices if str(d.get("name", "")).startswith("iPhone")),
                  None,
              )
          if picked is None:
              sys.exit("no available iPhone simulator on this runner")

          udid = picked["udid"]
          print(f"Booting {picked['name']} ({udid})")
          subprocess.run(["xcrun", "simctl", "boot", udid], check=False)
          subprocess.check_call(["xcrun", "simctl", "bootstatus", udid, "-b"])
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf8") as fh:
              fh.write(f"SIM_UDID={udid}\n")
          PY

      - name: Run Maestro suites on simulator
        run: yarn e2e:ios -- --skip-sim --headless --sim-udid "$SIM_UDID"

      - name: Upload Maestro debug output
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-debug-ios
          path: maestro-debug
          include-hidden-files: true
