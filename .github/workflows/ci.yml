name: CI

# Runs on PR open/update against ANY base branch (stacked PRs included),
# plus direct pushes to main and claude/** working branches.
on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:

# One run per commit: when a push and a pull_request event fire for the same
# head SHA (branch with an open PR), the second run supersedes the first
# instead of running the whole matrix twice.
concurrency:
  group: ci-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  typescript:
    name: TypeScript build & tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable corepack (Yarn 4)
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build module (tsc)
        run: yarn build

      - name: Build config plugin
        run: npx expo-module build plugin

      - name: Run unit tests (jest)
        run: yarn test

  android:
    name: Android build (example app)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Enable corepack (Yarn 4)
        run: corepack enable

      # Root install first: autolinking resolves the module from .. and the
      # example's app.json loads ../app.plugin.js.
      - name: Install module dependencies
        run: yarn install --immutable

      # app.plugin.js requires ./plugin/build, which this generates. npm runs
      # the root `prepare` script on install; Yarn 4 does not, so CI builds it
      # explicitly.
      - name: Build config plugin
        run: npx expo-module build plugin

      - name: Install example dependencies
        working-directory: example
        run: yarn install --immutable

      - name: Prebuild Android project
        working-directory: example
        run: npx expo prebuild --platform android --no-install

      - name: Kotlin unit tests (module)
        working-directory: example/android
        run: ./gradlew testDebugUnitTest

      - name: Compile Android app + module
        working-directory: example/android
        run: ./gradlew assembleDebug

  android-e2e:
    name: Android e2e (Maestro)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Enable KVM for emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Enable corepack (Yarn 4)
        run: corepack enable

      - name: Install module dependencies
        run: yarn install --immutable

      - name: Build config plugin
        run: npx expo-module build plugin

      - name: Install example dependencies
        working-directory: example
        run: yarn install --immutable

      - name: Prebuild Android project
        working-directory: example
        run: npx expo prebuild --platform android --no-install

      # Release build bundles the JS (no Metro needed on-device); the Expo
      # prebuild template signs release with the debug keystore by default.
      - name: Build release APK
        working-directory: example/android
        run: ./gradlew assembleRelease

      - name: Install Maestro
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      # The emulator needs a host audio server or its virtual audio device
      # never consumes frames — AudioTrack writes then block forever and the
      # pipeline never drains (run #4 failed exactly this way: "pulseaudio:
      # Failed to initialize PA context").
      - name: Start PulseAudio (emulator audio backend)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq pulseaudio
          pulseaudio --start --exit-idle-time=-1
          pactl info

      # Note: default emulator options minus -no-audio, so AudioTrack and
      # AudioRecord behave like a real device.
      - name: Run Maestro suites on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -no-boot-anim -camera-back none
          script: |
            adb install -r example/android/app/build/outputs/apk/release/app-release.apk
            # On failure, dump the live UI hierarchy (contains suite status and
            # per-test failure details) and a logcat tail directly into the job
            # log, so failures are diagnosable without downloading artifacts.
            maestro test .maestro/all-suites.yml --debug-output maestro-debug || {
              echo '==== UI hierarchy at failure ===='
              maestro hierarchy || true
              echo '==== logcat tail ===='
              adb logcat -d | grep -iE 'expo|audiostream|pipeline|ReactNative|AndroidRuntime|maestro' | tail -n 200 || true
              exit 1
            }

      # Maestro writes into a hidden .maestro/ subdirectory, so hidden files
      # must be included or the artifact uploads empty.
      - name: Upload Maestro debug output
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-debug
          path: maestro-debug
          include-hidden-files: true

  ios:
    name: iOS build (example app)
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable corepack (Yarn 4)
        run: corepack enable

      # Fast native-logic signal before the expensive app build: JitterBuffer
      # is dependency-free Swift, compiled and run directly.
      - name: Swift unit tests (JitterBuffer)
        run: |
          swiftc -parse-as-library -o /tmp/jitterbuffer-tests \
            ios/JitterBuffer.swift tests/ios/JitterBufferTests.swift
          /tmp/jitterbuffer-tests

      - name: Install module dependencies
        run: yarn install --immutable

      # app.plugin.js requires ./plugin/build, which this generates. npm runs
      # the root `prepare` script on install; Yarn 4 does not, so CI builds it
      # explicitly.
      - name: Build config plugin
        run: npx expo-module build plugin

      - name: Install example dependencies
        working-directory: example
        run: yarn install --immutable

      - name: Prebuild iOS project
        working-directory: example
        run: npx expo prebuild --platform ios --no-install

      - name: Install CocoaPods
        working-directory: example
        run: npx pod-install ios

      - name: Compile iOS app + module
        working-directory: example/ios
        run: |
          set -o pipefail
          WORKSPACE=$(ls -d *.xcworkspace | head -n1)
          SCHEME="${WORKSPACE%.xcworkspace}"
          echo "Building workspace=$WORKSPACE scheme=$SCHEME"
          xcodebuild build \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            | tail -n 200
