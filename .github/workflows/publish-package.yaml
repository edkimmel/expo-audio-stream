name: Publish package to GitHub Packages and npm
# NOTE: the release trigger is disabled — it's been broken (yarn honors
# publishConfig.registry over setup-node's registry-url, so the GitHub
# Packages step above actually hits registry.npmjs.org with the wrong
# token and fails before the real npm step ever runs). Publishing has
# been done manually via `npm publish` instead.
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: "18.18.2"
          registry-url: "https://npm.pkg.github.com"
          scope: "@edkimmel"
        env:
          NPM_PUBLISH_REGISTRY: https://npm.pkg.github.com
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: yarn
      - run: yarn build
      - run: yarn build plugin
      - run: yarn npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v3
        with:
          node-version: "18.18.2"
          registry-url: "https://registry.npmjs.org"
          scope: "@edkimmel"
          always-auth: true
      - run: yarn npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPMJS_TOKEN }}
          NPM_PUBLISH_REGISTRY: https://registry.npmjs.org
